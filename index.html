<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <meta name='description' content='Convert from anything to anything'>
    <title>Temperature Conversion</title>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <main>
        <span class="heading">
            <h1>Temperature Unit Converter</h1>
            <button type="button">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-maximize preview-icon" aria-hidden="true">
                    <path d="M8 3H5a2 2 0 0 0-2 2v3" />
                    <path d="M21 8V5a2 2 0 0 0-2-2h-3" />
                    <path d="M3 16v3a2 2 0 0 0 2 2h3" />
                    <path d="M16 21h3a2 2 0 0 0 2-2v-3" />
                </svg>

            </button>
        </span>
        <form method="get">
            <div id="from">
                <select name="from-scale" id="from-select" value="c">
                    <option value="c">Celsius °C</option>
                </select>
                <input type="number" step="any" name="from-value" id="from-input" placeholder="0">
            </div>
            <div id="to">
                <input type="number" step="any" name="to-value" id="to-input" placeholder="32">
                <select name="to-scale" id="to-select" value="f">
                    <option value="f">Fahrenheit °F</option>
                    <option value="k">Kelvin K</option>
                    <option value="re">Réamur °Ré</option>
                </select>
            </div>
            <input type="text" name="updated-field">
            <table>
                <thead>
                    <tr>
                        <th scope="col">No</th>
                        <th scope="col">°C</th>
                        <th scope="col">°F</th>
                        <th scope="col">K</th>
                        <th scope="col">°Ré</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </form>
    </main>

    <script>
        const queries = [];

        const formEl = document.querySelector("form")
        const fromScaleEl = document.querySelector("#from>select")
        const fromValueEl = document.getElementById("from-input")
        const toScaleEl = document.querySelector("#to>select")
        const toValueEl = document.getElementById("to-input")
        const updatedField = document.querySelector('input[name="updated-field"]')
        const tbodyEl = document.querySelector("tbody")

        formEl.addEventListener("submit", handleOnFormSubmit)
        fromScaleEl.addEventListener("change", handleOnFieldChange)
        fromValueEl.addEventListener("change", handleOnFieldChange)
        toScaleEl.addEventListener("change", handleOnFieldChange)
        toValueEl.addEventListener("change", handleOnFieldChange)

        function handleOnFormSubmit(e) {
            e.preventDefault()

            const fd = new FormData(e.target)

            const fromScale = fd.get("from-scale")
            const fromValue = Number(fd.get("from-value"))
            const toScale = fd.get("to-scale")
            const toValue = Number(fd.get("to-value"))
            const updatedField = fd.get("updated-field")

            let result

            if (updatedField === "fs" || updatedField === "fv") {
                result = getResult(fromValue, fromScale, toScale)
                refreshPage(fromScale, fromValue, toScale, result)
            } else {
                result = getResult(toValue, toScale, fromScale)
                refreshPage(fromScale, result, toScale, toValue)
            }

            save()
            renderTable()
        }

        function createRow(no, c, f, k, re) {
            const trEl = document.createElement("tr")
            const noEl = document.createElement("th")
            noEl.scope = "row"
            noEl.textContent = no

            const cEl = document.createElement("td")
            cEl.textContent = c

            const fEl = document.createElement("td")
            fEl.textContent = f

            const kEl = document.createElement("td")
            kEl.textContent = k

            const reEl = document.createElement("td")
            reEl.textContent = re

            trEl.append(noEl, cEl, fEl, kEl, reEl)
            return trEl
        }

        function renderTable() {
            tbodyEl.replaceChildren()
            queries.forEach((q, i) => tbodyEl.appendChild(createRow(i + 1, Number(q.c).toFixed(3), Number(q.f).toFixed(3), Number(q.k).toFixed(3), Number(q.re).toFixed(3))))
        }

        function save() {
            fromScale = fromScaleEl.value
            fromValue = Number(fromValueEl.value)
            toScale = toScaleEl.value
            toValue = Number(toValueEl.value)

            const query = new Map()

            query.set("c", fromValue)
            if (toScale !== 'f')
                query.set("f", getResult(fromValue, "c", "f"))

            if (toScale !== 'k')
                query.set("k", getResult(fromValue, "c", "k"))

            if (toScale !== 're')
                query.set("re", getResult(fromValue, "c", "re"))

            query.set(toScale, toValue)

            queries.push(Object.fromEntries(query.entries()))

            console.log(queries)
        }

        function handleOnFieldChange(e) {
            if (e.target === fromScaleEl)
                updatedField.value = "fs"
            else if (e.target === fromValueEl)
                updatedField.value = "fv"
            else if (e.target === toScaleEl)
                updatedField.value = "ts"
            else {
                updatedField.value = "tv"
            }

            formEl.requestSubmit()
        }

        function getResult(value, from, to) {
            if (from === 'c') {

                if (to === 'k')
                    return value + 273.15

                if (to === 're')
                    return value * (4 / 5)

                if (to === 'f')
                    return (value * 9 / 5) + 32
            }

            if (from === 'f') {
                if (to === 'c')
                    return (value - 32) * 5 / 9
            }

            if (from === 're') {
                if (to === 'c')
                    return value * (5 / 4)
            }

            if (from === 'k') {
                if (to === 'c')
                    return value - 273.15
            }
        }

        function refreshPage(fs, fv, ts, tv) {
            fromScaleEl.value = fs
            fromValueEl.value = fv
            toScaleEl.value = ts
            toValueEl.value = tv
        }
    </script>
</body>

</html>
