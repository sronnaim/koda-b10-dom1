<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <meta name='description' content='Convert from anything to anything'>
    <title>Temperature Conversion</title>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <main>
        <h1>Temperature Unit Converter</h1>
        <div id="from">
            <select name="from-scale" id="from-select">
                <option value="c">Celsius °C</option>
            </select>
            <input type="number" name="from-value" id="from-input" placeholder="0">
        </div>
        <div id="to">
            <input type="number" name="to-scale" id="to-input" placeholder="32">
            <select name="to-value" id="to-select">
                <option value="f">Fahrenheit °F</option>
                <option value="k">Kelvin °K</option>
                <option value="re">Réamur °Ré</option>
            </select>
        </div>
    </main>

    <script>
        let from = 'c'
        let to = 'f'
        let fromValue
        let toValue

        const fromSelect = document.querySelector("#from>select")
        const fromInput = document.getElementById("from-input")
        const toSelect = document.querySelector("#to>select")
        const toInput = document.getElementById("to-input")

        fromSelect.value = from
        toSelect.value = to

        fromSelect.addEventListener("change", handleFromSelectChange)
        fromInput.addEventListener("change", handleFromInputChange)
        toSelect.addEventListener("change", handleToSelectChange)
        toInput.addEventListener("change", handleToInputChange)

        function handleFromSelectChange(e) {
            from = e.srcElement.value
            toValue = getResult(fromValue, from, to)

            refreshPage()
        }

        function handleFromInputChange(e) {
            fromValue = Number(e.srcElement.value)
            toValue = getResult(fromValue, from, to)

            refreshPage()
        }

        function handleToSelectChange(e) {
            to = e.srcElement.value
            fromValue = getResult(toValue, to, from)

            refreshPage()
        }

        function handleToInputChange(e) {
            toValue = Number(e.srcElement.value)
            fromValue = getResult(toValue, to, from)

            refreshPage()
        }

        function getResult(value, from, to) {
            if (from === 'c') {

                if (to === 'k')
                    return value + 273.15

                if (to === 're')
                    return value * (4 / 5)

                if (to === 'f')
                    return (value * 9 / 5) + 32
            }

            if (from === 'f') {
                if (to === 'c')
                    return (value - 32) * 5 / 9
            }

            if (from === 're') {
                if (to === 'c')
                    return value * (5 / 4)
            }

            if (from === 'k') {
                if (to === 'c')
                    return value - 273.15
            }
        }

        function refreshPage() {
            fromSelect.value = from
            fromInput.value = fromValue
            toSelect.value = to
            toInput.value = toValue
        }
    </script>
</body>

</html>
