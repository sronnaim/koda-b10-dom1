<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <meta name='description' content='Convert from anything to anything'>
    <title>Temperature Conversion</title>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <main>
        <h1>Temperature Unit Converter</h1>
        <form method="get">
            <div id="from">
                <select name="from-scale" id="from-select" value="c">
                    <option value="c">Celsius °C</option>
                </select>
                <input type="number" step="any" name="from-value" id="from-input" placeholder="0">
            </div>
            <div id="to">
                <input type="number" step="any" name="to-value" id="to-input" placeholder="32">
                <select name="to-scale" id="to-select" value="f">
                    <option value="f">Fahrenheit °F</option>
                    <option value="k">Kelvin °K</option>
                    <option value="re">Réamur °Ré</option>
                </select>
            </div>
            <input type="text" name="updated-field">
            <button aria-hidden="true"></button>
        </form>
    </main>

    <script>
        const formEl = document.querySelector("form")
        const fromScaleEl = document.querySelector("#from>select")
        const fromValueEl = document.getElementById("from-input")
        const toScaleEl = document.querySelector("#to>select")
        const toValueEl = document.getElementById("to-input")
        const updatedField = document.querySelector('input[name="updated-field"]')

        formEl.addEventListener("submit", handleOnFormSubmit)
        fromScaleEl.addEventListener("change", handleOnFieldChange)
        fromValueEl.addEventListener("change", handleOnFieldChange)
        toScaleEl.addEventListener("change", handleOnFieldChange)
        toValueEl.addEventListener("change", handleOnFieldChange)

        function handleOnFormSubmit(e) {
            e.preventDefault()

            const fd = new FormData(e.target)

            const fromScale = fd.get("from-scale")
            const fromValue = Number(fd.get("from-value"))
            const toScale = fd.get("to-scale")
            const toValue = Number(fd.get("to-value"))
            const updatedField = fd.get("updated-field")

            if (updatedField === "fs" || updatedField === "fv") {
                const result = getResult(fromValue, fromScale, toScale)
                refreshPage(fromScale, fromValue, toScale, result)
            } else {
                const result = getResult(toValue, toScale, fromScale)
                refreshPage(fromScale, result, toScale, toValue)
            }
        }

        function handleOnFieldChange(e) {
            if (e.target === fromScaleEl)
                updatedField.value = "fs"
            else if (e.target === fromValueEl)
                updatedField.value = "fv"
            else if (e.target === toScaleEl)
                updatedField.value = "ts"
            else {
                updatedField.value = "tv"
            }

            formEl.requestSubmit()
        }

        function handleFromSelectChange(e) {
            from = e.srcElement.value
            toValue = getResult(fromValue, from, to)

            refreshPage()
        }

        function handleFromInputChange(e) {
            fromValue = Number(e.srcElement.value)
            toValue = getResult(fromValue, from, to)

            refreshPage()
        }

        function handleToSelectChange(e) {
            to = e.srcElement.value
            fromValue = getResult(toValue, to, from)

            refreshPage()
        }

        function handleToInputChange(e) {
            toValue = Number(e.srcElement.value)
            fromValue = getResult(toValue, to, from)

            refreshPage()
        }

        function getResult(value, from, to) {
            if (from === 'c') {

                if (to === 'k')
                    return value + 273.15

                if (to === 're')
                    return value * (4 / 5)

                if (to === 'f')
                    return (value * 9 / 5) + 32
            }

            if (from === 'f') {
                if (to === 'c')
                    return (value - 32) * 5 / 9
            }

            if (from === 're') {
                if (to === 'c')
                    return value * (5 / 4)
            }

            if (from === 'k') {
                if (to === 'c')
                    return value - 273.15
            }
        }

        function refreshPage(fs, fv, ts, tv) {
            fromScaleEl.value = fs
            fromValueEl.value = fv
            toScaleEl.value = ts
            toValueEl.value = tv
        }
    </script>
</body>

</html>
